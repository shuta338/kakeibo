<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家計簿">
  <title>家計簿</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="month-header">
      <button class="month-arrow" id="prevMonth" type="button" aria-label="前の月">‹</button>
      <div class="month-title">
        <span id="yearLabel"></span>
        <strong id="monthLabel"></strong>
      </div>
      <button class="month-arrow" id="nextMonth" type="button" aria-label="次の月">›</button>
    </header>

    <main>
      <section class="tab-panel active" id="dashboardPanel" aria-labelledby="tabDashboard">
        <div class="ledger-table" id="ledgerTable" aria-label="月別カテゴリ集計">
          <div class="ledger-fixed-column" id="ledgerFixedColumn"></div>
          <div class="ledger-month-scroll" id="ledgerMonthScroll">
            <div class="ledger-month-grid" id="ledgerMonthGrid"></div>
          </div>
        </div>
      </section>

      <section class="panel tab-panel" id="categoryDetailPanel" aria-labelledby="categoryDetailTitle">
        <div class="panel-head detail-head">
          <button class="back-button" id="backToDashboardButton" type="button" aria-label="集計に戻る">‹</button>
          <h2 id="categoryDetailTitle">費目</h2>
          <span class="subtle" id="categoryDetailTotal">0</span>
        </div>
        <div class="entry-list" id="categoryDetailList"></div>
      </section>

      <section class="panel tab-panel" id="inputPanel" aria-labelledby="tabInput">
        <form id="entryForm" class="entry-form">
          <div class="input-header">
            <h2>支出入力</h2>
            <button class="close-button" id="closeInputButton" type="button" aria-label="前の画面に戻る">×</button>
          </div>
          <input type="hidden" id="entryId">

          <label class="field">
            <span>日付</span>
            <div class="date-control">
              <input id="dateDisplay" class="date-display" type="text" readonly aria-label="日付">
              <button class="calendar-button" id="calendarButton" type="button" aria-label="カレンダーを開く">▣</button>
              <input id="dateInput" class="native-date-input" type="date" required tabindex="-1" aria-hidden="true">
            </div>
          </label>

          <label class="field">
            <span>金額</span>
            <input id="amountInput" type="number" min="1" inputmode="numeric" required>
          </label>

          <label class="field">
            <span>カテゴリ</span>
            <select id="categoryInput" required></select>
          </label>

          <label class="field">
            <span>メモ</span>
            <input id="memoInput" type="text" maxlength="60">
          </label>

          <div class="form-actions">
            <button class="primary-button" type="submit" id="saveButton">追加</button>
            <button class="ghost-button" type="button" id="cancelEditButton" hidden>キャンセル</button>
          </div>
        </form>
      </section>

      <section class="panel tab-panel" id="historyPanel" aria-labelledby="tabHistory">
        <div class="panel-head">
          <h2>履歴</h2>
          <button class="ghost-button compact" id="exportButton" type="button">CSV</button>
        </div>
        <div class="entry-list" id="entryList"></div>
      </section>

      <section class="panel tab-panel" id="statsPanel" aria-labelledby="tabStats">
        <div class="panel-head">
          <h2>カテゴリ</h2>
          <span class="subtle" id="entryCount">0件</span>
        </div>
        <div class="category-list" id="categoryList"></div>
      </section>
    </main>

    <button class="fab-button" id="addEntryButton" type="button" aria-label="支出を追加">＋</button>

    <nav class="tabbar" aria-label="画面切替">
      <button class="tab-button active" id="tabDashboard" data-tab="dashboardPanel" type="button">
        <span>表</span>
        集計
      </button>
      <button class="tab-button" id="tabHistory" data-tab="historyPanel" type="button">
        <span>≡</span>
        履歴
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
